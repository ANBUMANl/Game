DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Battle Royale 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{ --accent:#33d17a; --danger:#ff4d4f; --text:#f2f5f7; --muted:#aeb8c2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:#0a0d10;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
#wrap{position:relative;width:100%;height:100%;}
canvas#c{position:absolute;inset:0;display:block;}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));font-size:13px;color:var(--muted);z-index:5;pointer-events:none;}
#hud b{color:var(--text);}
#hp{width:90px;height:8px;background:#333;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
#hpbar{height:100%;background:var(--accent);width:100%;transition:width .2s;}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.65);padding:20px 28px;border-radius:12px;display:none;z-index:10;}
#msg h2{margin:0 0 8px;font-size:22px;}
#msg button{margin-top:10px;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#0a0d10;font-weight:700;font-size:15px;}
#stick{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);z-index:6;}
#stickKnob{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35);top:28px;left:28px;}
#fireBtn{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));right:24px;width:80px;height:80px;border-radius:50%;background:rgba(255,77,79,.35);border:1px solid rgba(255,77,79,.6);color:#fff;font-weight:700;font-size:13px;z-index:6;}
#hint{position:absolute;top:calc(40px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);z-index:5;text-align:center;width:90%;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><div>🎯 Kills: <b id="kills">0</b></div><div>Alive: <b id="alive">16</b></div><div>HP<span id="hp"><span id="hpbar"></span></span></div></div>
  <div id="hint">Left stick: move · drag right side of screen: look around · FIRE to shoot</div>
  <canvas id="c"></canvas>
  <div id="msg"><h2 id="msgTitle">Game Over</h2><div id="msgSub" style="color:var(--muted);font-size:14px;"></div><br><button onclick="startGame()">Play Again</button></div>
  <div id="stick"><div id="stickKnob"></div></div>
  <button id="fireBtn">FIRE</button>
</div>
<script>
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d10);
scene.fog = new THREE.Fog(0x0a0d10, 40, 140);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
window.addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x223022, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(30,50,10);
scene.add(sun);

const WORLD = 100;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD*2, WORLD*2, 40,40), new THREE.MeshStandardMaterial({color:0x1b2b1e, wireframe:false}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const grid = new THREE.GridHelper(WORLD*2, 40, 0x2a3a2e, 0x223022);
scene.add(grid);

function makeCharMesh(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.4,10), new THREE.MeshStandardMaterial({color}));
  body.position.y = 0.9;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4,10,10), new THREE.MeshStandardMaterial({color}));
  head.position.y = 1.9;
  g.add(body, head);
  return g;
}

let player, bots, bullets, loot, zoneMesh, zone, kills, alive, gameOver, camYaw, camPitch;

function rand(a,b){return a+Math.random()*(b-a);}
function dist2(ax,az,bx,bz){return Math.hypot(ax-bx, az-bz);}

function startGame(){
  document.getElementById('msg').style.display='none';
  // clear old
  [player, ...(bots||[]), ...(bullets||[]).map(b=>b.mesh), ...(loot||[]).map(l=>l.mesh), zoneMesh].forEach(o=>{ if(o) scene.remove(o.mesh||o); });

  player = { mesh: makeCharMesh(0x33d17a), x:0, z:0, hp:100, alive:true, shootCd:0, yaw:0 };
  scene.add(player.mesh);
  camYaw = 0; camPitch = 0.35;

  bots = [];
  for(let i=0;i<15;i++){
    const a = Math.random()*Math.PI*2, r = rand(15,70);
    const b = { mesh: makeCharMesh(0xe05263), x:Math.cos(a)*r, z:Math.sin(a)*r, hp:100, alive:true, shootCd:0, wt:0, wa:0 };
    scene.add(b.mesh);
    bots.push(b);
  }

  bullets = [];
  loot = [];
  for(let i=0;i<18;i++){
    const x = rand(-WORLD*0.8,WORLD*0.8), z = rand(-WORLD*0.8,WORLD*0.8);
    const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), new THREE.MeshStandardMaterial({color:0xf7c948, emissive:0x442f00}));
    mesh.position.set(x,0.6,z);
    scene.add(mesh);
    loot.push({x,z,mesh,taken:false});
  }

  zone = { r: WORLD*0.95, target: 10, t:0 };
  const zoneGeo = new THREE.CylinderGeometry(zone.r, zone.r, 30, 48, 1, true);
  const zoneMat = new THREE.MeshBasicMaterial({color:0xff4d4f, transparent:true, opacity:0.15, side:THREE.DoubleSide});
  zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
  zoneMesh.position.y = 15;
  scene.add(zoneMesh);

  kills=0; alive=16; gameOver=false;
  document.getElementById('kills').textContent=kills;
  document.getElementById('alive').textContent=alive;
  resize();
  requestAnimationFrame(loop);
}

// left stick (move)
const stick = document.getElementById('stick'), knob = document.getElementById('stickKnob');
let stickVec={x:0,y:0}, stickTouchId=null;
function setKnob(dx,dy){ knob.style.left=(28+dx)+'px'; knob.style.top=(28+dy)+'px'; }
function handleStick(t){
  const rect = stick.getBoundingClientRect();
  let dx = t.clientX-(rect.left+rect.width/2), dy = t.clientY-(rect.top+rect.height/2);
  const max=36, d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max; dy=dy/d*max;}
  setKnob(dx,dy);
  stickVec = {x:dx/max, y:dy/max};
}
stick.addEventListener('touchstart', e=>{stickTouchId=e.changedTouches[0].identifier; handleStick(e.changedTouches[0]);});
stick.addEventListener('touchmove', e=>{e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===stickTouchId) handleStick(t);} }, {passive:false});
stick.addEventListener('touchend', e=>{stickTouchId=null; stickVec={x:0,y:0}; setKnob(0,0);});

// right side drag = look around
let lookTouchId=null, lastLook=null;
document.getElementById('c').addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){
    if(t.clientX > innerWidth*0.45 && lookTouchId===null){ lookTouchId=t.identifier; lastLook={x:t.clientX,y:t.clientY}; }
  }
});
document.getElementById('c').addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===lookTouchId){
      const dx=t.clientX-lastLook.x, dy=t.clientY-lastLook.y;
      camYaw -= dx*0.005; camPitch = Math.max(0.05,Math.min(1.1, camPitch - dy*0.003));
      lastLook={x:t.clientX,y:t.clientY};
    }
  }
});
document.getElementById('c').addEventListener('touchend', e=>{ for(const t of e.changedTouches){ if(t.identifier===lookTouchId) lookTouchId=null; } });

// mouse fallback
let mouseDown=false, lastMouse=null;
document.getElementById('c').addEventListener('mousedown', e=>{mouseDown=true; lastMouse={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup', ()=>mouseDown=false);
window.addEventListener('mousemove', e=>{
  if(mouseDown){ const dx=e.clientX-lastMouse.x, dy=e.clientY-lastMouse.y;
    camYaw -= dx*0.005; camPitch = Math.max(0.05,Math.min(1.1,camPitch-dy*0.003)); lastMouse={x:e.clientX,y:e.clientY}; }
});

const keys={};
window.addEventListener('keydown', e=>{keys[e.key.toLowerCase()]=true; if(e.key===' ') fire(player);});
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
document.getElementById('fireBtn').addEventListener('touchstart', e=>{e.preventDefault(); fire(player);});
document.getElementById('c').addEventListener('click', ()=>fire(player));

function fire(shooter){
  if(shooter.shootCd>0 || !shooter.alive) return;
  shooter.shootCd = shooter===player? 16 : 60;
  const dx = Math.sin(shooter.yaw||camYaw), dz = Math.cos(shooter.yaw||camYaw);
  const geo = new THREE.SphereGeometry(0.12,6,6);
  const mat = new THREE.MeshBasicMaterial({color:0xffffff});
  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.set(shooter.x, 1.2, shooter.z);
  scene.add(mesh);
  bullets.push({x:shooter.x,z:shooter.z,dx:dx*1.6,dz:dz*1.6,mesh,life:60,owner:shooter});
}

function loop(){
  if(!gameOver) update();
  render();
  requestAnimationFrame(loop);
}

function update(){
  // player move relative to camera yaw
  let mx=0, mz=0;
  if(keys['w']||keys['arrowup']) mz-=1;
  if(keys['s']||keys['arrowdown']) mz+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  mx += stickVec.x; mz += stickVec.y;
  const len = Math.hypot(mx,mz);
  if(len>0.15){
    const nx=mx/len, nz=mz/len;
    const wx = nx*Math.cos(camYaw) + nz*Math.sin(camYaw);
    const wz = -nx*Math.sin(camYaw) + nz*Math.cos(camYaw);
    player.x += wx*0.35; player.z += wz*0.35;
    player.yaw = Math.atan2(wx, wz);
  }
  player.x = Math.max(-WORLD,Math.min(WORLD,player.x));
  player.z = Math.max(-WORLD,Math.min(WORLD,player.z));
  player.mesh.position.set(player.x,0,player.z);
  player.mesh.rotation.y = player.yaw||0;
  if(player.shootCd>0) player.shootCd--;

  // zone shrink
  zone.t += 1/60;
  const dur=45, t=Math.min(1,zone.t/dur);
  zone.r = WORLD*0.95*(1-t) + zone.target*t;
  zoneMesh.geometry.dispose();
  zoneMesh.geometry = new THREE.CylinderGeometry(zone.r, zone.r, 30, 48, 1, true);
  if(dist2(player.x,player.z,0,0) > zone.r) player.hp -= 0.08;

  // bots
  bots.forEach(b=>{
    if(!b.alive) return;
    const dToPlayer = dist2(b.x,b.z,player.x,player.z);
    const outside = dist2(b.x,b.z,0,0) > zone.r;
    let dx=0,dz=0;
    if(outside){
      const a = Math.atan2(-b.z,-b.x);
      dx = Math.cos(a); dz = Math.sin(a);
    } else if(dToPlayer < 30){
      const a = Math.atan2(player.x-b.x, player.z-b.z);
      if(dToPlayer>8){ dx=Math.sin(a); dz=Math.cos(a); }
      b.yaw = a;
      if(b.shootCd>0) b.shootCd--; else fire(b);
    } else {
      b.wt -= 1;
      if(b.wt<=0){ b.wa = Math.random()*Math.PI*2; b.wt=60; }
      dx = Math.cos(b.wa)*0.5; dz = Math.sin(b.wa)*0.5;
    }
    b.x += dx*0.18; b.z += dz*0.18;
    b.x = Math.max(-WORLD,Math.min(WORLD,b.x)); b.z = Math.max(-WORLD,Math.min(WORLD,b.z));
    b.mesh.position.set(b.x,0,b.z);
    if(b.yaw!==undefined) b.mesh.rotation.y = b.yaw;
  });

  // bullets
  bullets.forEach(bl=>{
    bl.x += bl.dx; bl.z += bl.dz; bl.life--;
    bl.mesh.position.set(bl.x,1.2,bl.z);
    const targets = bl.owner===player ? bots.filter(b=>b.alive) : [player, ...bots.filter(b=>b.alive && b!==bl.owner)];
    for(const tg of targets){
      if(tg.alive && dist2(bl.x,bl.z,tg.x,tg.z) < 0.9){
        tg.hp -= 14; bl.life=0;
        if(tg.hp<=0 && tg.alive){
          tg.alive=false; alive--; scene.remove(tg.mesh);
          if(bl.owner===player){ kills++; document.getElementById('kills').textContent=kills; }
          document.getElementById('alive').textContent=alive;
        }
        break;
      }
    }
  });
  bullets = bullets.filter(b=>{ if(b.life<=0){ scene.remove(b.mesh); return false;} return true; });

  // loot heal
  loot.forEach(l=>{
    if(!l.taken){
      l.mesh.rotation.y += 0.05;
      if(dist2(l.x,l.z,player.x,player.z) < 1.5 && player.hp<100){ l.taken=true; scene.remove(l.mesh); player.hp=Math.min(100,player.hp+25); }
    }
  });

  document.getElementById('hpbar').style.width = Math.max(0,player.hp)+'%';
  document.getElementById('hpbar').style.background = player.hp>50 ? '#33d17a' : '#ff4d4f';

  if(player.hp<=0) endGame(false);
  if(bots.filter(b=>b.alive).length===0) endGame(true);

  // camera follow (third person)
  const camDist=7, camHeight=3+camPitch*4;
  camera.position.x = player.x - Math.sin(camYaw)*camDist;
  camera.position.z = player.z - Math.cos(camYaw)*camDist;
  camera.position.y = camHeight;
  camera.lookAt(player.x, 1.2, player.z);
}

function endGame(won){
  gameOver=true;
  document.getElementById('msgTitle').textContent = won ? '🏆 WINNER WINNER' : '💀 Eliminated';
  document.getElementById('msgSub').textContent = `Kills: ${kills} · Placed #${alive}`;
  document.getElementById('msg').style.display='block';
}

function render(){ renderer.render(scene,camera); }

startGame();
</script>
</body>
</html>
